services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: plow
      POSTGRES_PASSWORD: plow
      POSTGRES_DB: plow_party
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plow -d plow_party"]
      interval: 2s
      retries: 15

  api:
    build: .
    environment:
      PLOW_DATABASE_URL: postgresql+asyncpg://plow:plow@db:5432/plow_party
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
