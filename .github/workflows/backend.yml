name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "docs/api/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "docs/api/**", ".github/workflows/backend.yml"]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run python scripts/check_no_comments.py
      - run: uv run python scripts/export_openapi.py --check
      - run: uv run pytest
      - run: docker build --tag plow-party-api .
